# Type 0 CNC: LinuxCNC 2.9 starter config (task 2, D-92)
# Mesa 7I76EU over Ethernet, 3 closed-loop steppers (CL57T), Huanyang VFD on USB-RS485 (hy_vfd).
# Values marked CHECK must be confirmed on the bench (docs/linuxcnc.md). Units: mm, s.

[EMC]
VERSION = 1.1
MACHINE = Type0
DEBUG = 0

[DISPLAY]
DISPLAY = axis
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 1.5
MAX_SPINDLE_OVERRIDE = 1.2
DEFAULT_LINEAR_VELOCITY = 10
MAX_LINEAR_VELOCITY = 50
INTRO_GRAPHIC = linuxcnc.gif
INTRO_TIME = 2
PROGRAM_PREFIX = ~/linuxcnc/nc_files
INCREMENTS = 1mm .1mm .01mm .001mm
GEOMETRY = XYZ
CYCLE_TIME = 0.100

[FILTER]
PROGRAM_EXTENSION = .py Python Script
py = python3

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[RS274NGC]
PARAMETER_FILE = linuxcnc.var
# G21 mm, G17 XY plane, G40 no cutter comp, G49 no tool length offset, G90 absolute, G94 feed/min, G54
RS274NGC_STARTUP_CODE = G21 G17 G40 G49 G90 G94 G54

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 1000000

# Mesa card. CHECK the pin prefix on first start with:  halcmd show pin hm2
# If the board reports as 7i76e (or the field I/O name differs), change BOARD / FIELD here only.
[HMOT]
BOARD = 7i76eu
BOARD_IP = 192.168.1.121
# The hm2_eth config string (5 stepgens, field I/O on sserial port 0 mode 0) is written in type0.hal
FIELD = 7i76.0.0
WATCHDOG_NS = 5000000

# VFD on a USB-RS485 adapter (D-92). Use the /dev/serial/by-id/... name once known: it never changes.
[VFD]
DEVICE = /dev/ttyUSB0
BAUD = 9600
ADDRESS = 1
# Lost coolant flow for this long while the spindle is commanded on -> e-stop
FLOW_LOSS_DELAY = 3.0

[HAL]
HALUI = halui
HALFILE = type0.hal
HALFILE = spindle_hy.hal

[HALUI]

[KINS]
KINEMATICS = trivkins coordinates=XYZ
JOINTS = 3

[TRAJ]
COORDINATES = XYZ
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 10
MAX_LINEAR_VELOCITY = 50
POSITION_FILE = position.txt
NO_FORCE_HOMING = 0

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

[SPINDLE_0]
# G-Penny 2.2 kW, 400 Hz, 2 poles: 24,000 rpm at 400 Hz. Keep above 6,000 rpm (100 Hz) for cooling and torque.
MAX_FORWARD_VELOCITY = 24000
MIN_FORWARD_VELOCITY = 6000
MAX_REVERSE_VELOCITY = 0

# ---------------------------------------------------------------------------
# Common to all axes (D-13, D-15):
#   DFU1605 screws, 5 mm lead, direct drive (D-14).
#   CL57T set to 1,600 pulses/rev (CHECK DIP switches) -> 1600 / 5 = 320 steps/mm (3.1 um per step).
#   Step timing: CL57T needs about 2.5 us pulse and 5 us dir setup (CHECK manual). Doubled for margin.
#   Velocities are BENCH-TEST values (3 m/min). Raise towards 100 mm/s (6 m/min) after tuning on the machine.
# Coordinates follow cad/v2/type0_v2.py: X 0 = table centre, work X -200..200, ATC reach to 370 (Phase 2).
# Y 0 = spindle line, table travel -125..125. Z 0 = top (home), down to -150.
# HOME_OFFSET = switch position: measure and set during commissioning (CHECK).
# ---------------------------------------------------------------------------

[AXIS_X]
MIN_LIMIT = -200.0
MAX_LIMIT = 370.0
MAX_VELOCITY = 50
MAX_ACCELERATION = 300

[JOINT_0]
TYPE = LINEAR
HOME = 360.0
FERROR = 1.0
MIN_FERROR = 0.5
MAX_VELOCITY = 50
MAX_ACCELERATION = 300
STEPGEN_MAXVEL = 63
STEPGEN_MAXACCEL = 375
P = 1000
I = 0
D = 0
FF0 = 0
FF1 = 1
FF2 = 0
BIAS = 0
DEADBAND = 0
MAX_OUTPUT = 0
DIRSETUP = 10000
DIRHOLD = 10000
STEPLEN = 5000
STEPSPACE = 5000
# Flip the sign of SCALE if the axis runs the wrong way
SCALE = 320.0
MIN_LIMIT = -200.0
MAX_LIMIT = 370.0
HOME_OFFSET = 372.0
HOME_SEARCH_VEL = 10.0
HOME_LATCH_VEL = -1.0
HOME_FINAL_VEL = 20.0
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = YES
HOME_SEQUENCE = 1

[AXIS_Y]
MIN_LIMIT = -125.0
MAX_LIMIT = 125.0
MAX_VELOCITY = 50
MAX_ACCELERATION = 300

[JOINT_1]
TYPE = LINEAR
HOME = 120.0
FERROR = 1.0
MIN_FERROR = 0.5
MAX_VELOCITY = 50
MAX_ACCELERATION = 300
STEPGEN_MAXVEL = 63
STEPGEN_MAXACCEL = 375
P = 1000
I = 0
D = 0
FF0 = 0
FF1 = 1
FF2 = 0
BIAS = 0
DEADBAND = 0
MAX_OUTPUT = 0
DIRSETUP = 10000
DIRHOLD = 10000
STEPLEN = 5000
STEPSPACE = 5000
# Moving table: +Y in G-code moves the TABLE towards the front. Flip SCALE if it goes the wrong way.
SCALE = 320.0
MIN_LIMIT = -125.0
MAX_LIMIT = 125.0
HOME_OFFSET = 127.0
HOME_SEARCH_VEL = 10.0
HOME_LATCH_VEL = -1.0
HOME_FINAL_VEL = 20.0
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = YES
HOME_SEQUENCE = 1

[AXIS_Z]
MIN_LIMIT = -150.0
MAX_LIMIT = 0.0
MAX_VELOCITY = 30
MAX_ACCELERATION = 300

[JOINT_2]
TYPE = LINEAR
HOME = 0.0
FERROR = 1.0
MIN_FERROR = 0.5
MAX_VELOCITY = 30
MAX_ACCELERATION = 300
STEPGEN_MAXVEL = 38
STEPGEN_MAXACCEL = 375
P = 1000
I = 0
D = 0
FF0 = 0
FF1 = 1
FF2 = 0
BIAS = 0
DEADBAND = 0
MAX_OUTPUT = 0
DIRSETUP = 10000
DIRHOLD = 10000
STEPLEN = 5000
STEPSPACE = 5000
SCALE = 320.0
MIN_LIMIT = -150.0
MAX_LIMIT = 0.0
HOME_OFFSET = 2.0
HOME_SEARCH_VEL = 5.0
HOME_LATCH_VEL = -0.5
HOME_FINAL_VEL = 10.0
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = YES
# Z homes first, alone
HOME_SEQUENCE = 0

# Z brake (D-16, D-41): release this long after the drives are enabled, drives stay on this long after the brake drops.
[BRAKE]
RELEASE_DELAY = 0.25
DRIVE_OFF_DELAY = 0.15
