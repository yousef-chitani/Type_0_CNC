# Type 0 CNC: LinuxCNC 2.9 starter config (Phase 1)
# Mesa 7I76EU on Ethernet, 3 closed-loop steppers (CL57T), Huanyang VFD on USB-RS485 (hy_vfd).
# Units: mm. Speeds are deliberately low for first bring-up (D-92): 2 m/min, 200 mm/s^2.
# Every line marked CHECK must be confirmed on the real hardware (see docs/linuxcnc.md).

[EMC]
VERSION = 1.1
MACHINE = Type0
DEBUG = 0

[DISPLAY]
DISPLAY = axis
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 1.2
MAX_SPINDLE_OVERRIDE = 1.2
MIN_SPINDLE_OVERRIDE = 0.5
CYCLE_TIME = 0.100
PROGRAM_PREFIX = ~/linuxcnc/nc_files
INTRO_GRAPHIC = linuxcnc.gif
INTRO_TIME = 2
OPEN_FILE = ""
INCREMENTS = 10mm 1mm 0.1mm 0.01mm
DEFAULT_LINEAR_VELOCITY = 10.0
MAX_LINEAR_VELOCITY = 33.3
GEOMETRY = XYZ
# Side panel: VFD and interlock status
PYVCP = panel.xml

[KINS]
KINEMATICS = trivkins coordinates=XYZ
JOINTS = 3

[FILTER]
PROGRAM_EXTENSION = .py Python Script
py = python3

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[RS274NGC]
PARAMETER_FILE = type0.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
# 1 kHz servo thread (normal for Mesa Ethernet boards)
SERVO_PERIOD = 1000000

[HOSTMOT2]
DRIVER = hm2_eth
# The 7I76EU reports itself as "7I76E", so its HAL pins are hm2_7i76e.0.*
BOARD = 7i76e
# Jumpers W13/W14 down/down = fixed IP 192.168.1.121 (electrical.md section 3)
IPADDR = "192.168.1.121"
# 3 step generators for Phase 1 (Phase 2: 4 for the ATC wheel on TB2 channel 3).
# sserial mode 0 = plain field I/O (32 inputs, 16 outputs)
CONFIG = "num_encoders=0 num_pwmgens=0 num_stepgens=3 sserial_port_0=0XXX"

[HAL]
HALUI = halui
HALFILE = hm2.hal
HALFILE = machine.hal
HALFILE = spindle.hal
POSTGUI_HALFILE = postgui.hal
SHUTDOWN = shutdown.hal

[HALUI]

[TRAJ]
COORDINATES = XYZ
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 10.0
MAX_LINEAR_VELOCITY = 33.3
DEFAULT_LINEAR_ACCELERATION = 200.0
MAX_LINEAR_ACCELERATION = 200.0
POSITION_FILE = position.txt
NO_FORCE_HOMING = 0

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl
# Phase 1: manual ER20 changes. M6 pauses and asks for the tool.
TOOL_CHANGE_QUILL_UP = 1

[SPINDLE_0]
# G-Penny 2.2 kW, 400 Hz, 24,000 rpm. CHECK the minimum speed on the spindle sheet
# (water-cooled 2.2 kW spindles are usually limited to about 6,000 rpm / 100 Hz).
MAX_FORWARD_VELOCITY = 24000
MIN_FORWARD_VELOCITY = 6000
INCREMENT = 1000

# ---------------------------------------------------------------------------
# Axes and joints
# Scale: CL57T at 1,600 pulses/rev (D-92), DFU1605 5 mm lead -> 320 steps/mm.
# Step timing for the CL57T: CHECK against its manual (values here are generous).
# Homing (D-92): X to +X (ATC side), Y to +Y, Z up. One LJ12A3 PNP switch per axis,
# no hard limits (D-91). Soft limits start at the switch.
# Machine coordinates: X 0..570, Y 0..250, Z -150..0 (Z 0 = top).
# CHECK each axis direction on the first jog: flip the sign of SCALE if it runs backwards.
# ---------------------------------------------------------------------------

[AXIS_X]
MIN_LIMIT = 0.0
MAX_LIMIT = 570.0
MAX_VELOCITY = 33.3
MAX_ACCELERATION = 200.0

[JOINT_0]
TYPE = LINEAR
SCALE = 320.0
MAX_VELOCITY = 33.3
MAX_ACCELERATION = 200.0
STEPGEN_MAX_VEL = 41.7
STEPGEN_MAX_ACC = 250.0
FERROR = 1.0
MIN_FERROR = 0.25
MIN_LIMIT = 0.0
MAX_LIMIT = 570.0
BACKLASH = 0.000
DIRSETUP = 10000
DIRHOLD = 10000
STEPLEN = 5000
STEPSPACE = 5000
HOME_OFFSET = 570.0
HOME = 565.0
HOME_SEARCH_VEL = 10.0
HOME_LATCH_VEL = -1.0
HOME_FINAL_VEL = 20.0
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = YES
HOME_SEQUENCE = 1

[AXIS_Y]
MIN_LIMIT = 0.0
MAX_LIMIT = 250.0
MAX_VELOCITY = 33.3
MAX_ACCELERATION = 200.0

[JOINT_1]
TYPE = LINEAR
SCALE = 320.0
MAX_VELOCITY = 33.3
MAX_ACCELERATION = 200.0
STEPGEN_MAX_VEL = 41.7
STEPGEN_MAX_ACC = 250.0
FERROR = 1.0
MIN_FERROR = 0.25
MIN_LIMIT = 0.0
MAX_LIMIT = 250.0
BACKLASH = 0.000
DIRSETUP = 10000
DIRHOLD = 10000
STEPLEN = 5000
STEPSPACE = 5000
HOME_OFFSET = 250.0
HOME = 245.0
HOME_SEARCH_VEL = 10.0
HOME_LATCH_VEL = -1.0
HOME_FINAL_VEL = 20.0
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = YES
HOME_SEQUENCE = 1

[AXIS_Z]
MIN_LIMIT = -150.0
MAX_LIMIT = 0.0
MAX_VELOCITY = 33.3
MAX_ACCELERATION = 200.0

[JOINT_2]
TYPE = LINEAR
SCALE = 320.0
MAX_VELOCITY = 33.3
MAX_ACCELERATION = 200.0
STEPGEN_MAX_VEL = 41.7
STEPGEN_MAX_ACC = 250.0
FERROR = 1.0
MIN_FERROR = 0.25
MIN_LIMIT = -150.0
MAX_LIMIT = 0.0
BACKLASH = 0.000
DIRSETUP = 10000
DIRHOLD = 10000
STEPLEN = 5000
STEPSPACE = 5000
HOME_OFFSET = 0.0
HOME = -2.0
HOME_SEARCH_VEL = 5.0
HOME_LATCH_VEL = -0.5
HOME_FINAL_VEL = 10.0
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = YES
# Z homes first, so the spindle is up and clear before X and Y move
HOME_SEQUENCE = 0

# ---------------------------------------------------------------------------
# Type 0 settings used by the HAL files (not read by LinuxCNC itself)
# ---------------------------------------------------------------------------
[TYPE0]
# USB-RS485 adapter for the Huanyang VFD (D-92). Prefer the stable /dev/serial/by-id/... name.
VFD_PORT = /dev/ttyUSB0
# Huanyang PD164 = 1 (9,600 baud), PD165 = 3 (8N1 RTU), PD163 = 1 (address)
VFD_BAUD = 9600
VFD_ADDRESS = 1
# Z brake: wait for the Z drive to hold before releasing the brake (s)
BRAKE_RELEASE_DELAY = 0.3
# Keep the drives enabled this long after the brake engages (s)
DRIVE_OFF_DELAY = 0.15
# Coolant flow must be steady this long before the spindle may start (s)
FLOW_ON_DELAY = 2.0
# Ignore flow dropouts shorter than this (s)
FLOW_OFF_DELAY = 0.3
# Spindle on without coolant flow for this long -> e-stop (s)
FLOW_FAULT_DELAY = 5.0
# Spindle on without VFD communication for this long -> e-stop (s)
VFD_COMM_FAULT_DELAY = 2.0
