<text x="1214.0" y="367.0" font-family="sans-serif" font-size="8" text-anchor="start" fill="#d94801">machine feet</text>
<text x="1220.0" y="488.0" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#000" font-weight="bold">FRONT</text>
<text x="40.0" y="760.0" font-family="sans-serif" font-size="9" text-anchor="start" fill="#000">Legs: 2 x CLS 38x89 glued and screwed = 76 x 89. Legs sit under the machine feet lines (front and rear), so the feet load goes straight down.</text>
<text x="40.0" y="775.0" font-family="sans-serif" font-size="9" text-anchor="start" fill="#000">Front/back rails: a pair sandwiches each leg line, top and bottom: 2 x M10 rod through rail + leg + rail at each leg (top and bottom).</text>
<text x="40.0" y="790.0" font-family="sans-serif" font-size="9" text-anchor="start" fill="#000">Side rails: inner leg faces, 1 x M10 at each end. Braces: outer leg faces, front-bottom to rear-top, bolted through brace + leg + side rail.</text>
<text x="40.0" y="805.0" font-family="sans-serif" font-size="9" text-anchor="start" fill="#000">Top: 2 x 18 mm ply glued and screwed, screwed down into the top rails from above (countersunk, removable). Seal it (it is the enclosure floor).</text>
<text x="40.0" y="820.0" font-family="sans-serif" font-size="9" text-anchor="start" fill="#000">Shelf: 12 mm ply on the bottom rails. Cabinet front-left, coolant reservoir rear-right in a drip tray. Back: 12 mm ply screwed to the rear rails.</text>
<text x="40.0" y="835.0" font-family="sans-serif" font-size="9" text-anchor="start" fill="#000">Flat-pack: top (about 24 kg), 4 legs, 8 long rails, 4 side rails, 2 braces, shelf, back. Re-tighten the bolts after a month (timber shrinks).</text>
</svg>
