<text x="20.0" y="890.0" font-family="sans-serif" font-size="9" text-anchor="start" fill="#000">Y bars sit off-centre: rail holes 10 mm from the bar's OUTER edge, leaving an 8 mm lip to the spine edge.</text>
<text x="20.0" y="904.0" font-family="sans-serif" font-size="9" text-anchor="start" fill="#000">Holes: M5 rail holes, jig bolt M5 x 30 waxed through the floor + strip into each. 9 per bar.</text>
<text x="20.0" y="918.0" font-family="sans-serif" font-size="9" text-anchor="start" fill="#000">Strips: 4 mm hardboard, glued + pinned, edges taped. Link strip at the rear joins both recesses.</text>
<text x="20.0" y="932.0" font-family="sans-serif" font-size="9" text-anchor="start" fill="#000">Sleeves: 20 mm conduit, 110 long, on a waxed M12 rod through the floor and a top batten.</text>
<text x="20.0" y="946.0" font-family="sans-serif" font-size="9" text-anchor="start" fill="#000">Feet: 4 x M10 coupling nut + 50 mm rod + washer, hung from a batten on the OPEN face (underside).</text>
<text x="20.0" y="960.0" font-family="sans-serif" font-size="9" text-anchor="start" fill="#000">Probes: DS18B20 at mid-depth in the spine centre and 10 mm below the open face.</text>
