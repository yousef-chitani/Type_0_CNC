<text x="958.4" y="772.8" font-family="sans-serif" font-size="8" text-anchor="start" fill="#000">hold-down rod from the top batten</text>
<text x="700.0" y="946.4" font-family="sans-serif" font-size="8" text-anchor="start" fill="#000">Floor at left. The open face (right) becomes the portal back.</text>
<text x="20.0" y="735.0" font-family="sans-serif" font-size="9" text-anchor="start" fill="#000">Rail holes: M5, jig bolt M5 x 30 waxed through the floor + strip into each. Plug the bar backs with plasticine.</text>
<text x="20.0" y="749.0" font-family="sans-serif" font-size="9" text-anchor="start" fill="#000">End pads: crosswise pieces of the same 40x10 bar, butted to the rail bars. Ends of the pocket stay open: dam them at the levelling pour.</text>
<text x="20.0" y="763.0" font-family="sans-serif" font-size="9" text-anchor="start" fill="#000">Core: 68 mm round downpipe, ends sealed with an MDF disc + silicone + tape. Sits on 3 EG spacers (test-brick offcuts),</text>
<text x="20.0" y="777.0" font-family="sans-serif" font-size="9" text-anchor="start" fill="#000">      held down at 3 points by M6 rod from a batten across the walls (buoyancy about 6 kg).</text>
<text x="20.0" y="791.0" font-family="sans-serif" font-size="9" text-anchor="start" fill="#000">Leg-foot couplers: M12 coupling nut (36) + 100 mm M12 rod + nut + washer. Jig stud through the wall. Torque the studs to 25-30 Nm only (VERIFY on a test brick).</text>
<text x="20.0" y="805.0" font-family="sans-serif" font-size="9" text-anchor="start" fill="#000">Probes: DS18B20 in the beam above the core and in one leg.</text>
</svg>
