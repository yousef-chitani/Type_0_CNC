<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Helvetica, Arial, sans-serif"><rect width="1000" height="700" fill="#fff"/><text x="500.0" y="26" text-anchor="middle" font-size="17" font-weight="bold">Type 0 v2: 2-piece cast frame (concept, rev D: 400 × 250)</text><rect x="208.0" y="168.0" width="384.0" height="138.0" fill="#c9c9c4" fill-opacity="1" stroke="#333" stroke-width="0.8"/><rect x="304.0" y="306.0" width="192.0" height="258.0" fill="#c9c9c4" fill-opacity="1" stroke="#333" stroke-width="0.8"/><rect x="310.0" y="222.0" width="12.0" height="306.0" fill="#3d4f66" fill-opacity="1" stroke="#333" stroke-width="0.8"/><rect x="478.0" y="222.0" width="12.0" height="306.0" fill="#3d4f66" fill-opacity="1" stroke="#333" stroke-width="0.8"/><rect x="262.0" y="261.0" width="276.0" height="198.0" fill="#9fb6cc" fill-opacity="0.85" stroke="#333" stroke-width="0.8"/><rect x="208.0" y="216.0" width="480.0" height="78.0" fill="#d7c9b0" fill-opacity="0.75" stroke="#333" stroke-width="0.8"/><rect x="604.0" y="306.5" width="36.0" height="107.0" fill="#f3d27a" fill-opacity="0.9" stroke="#333" stroke-width="0.8"/><line x1="190.0" y1="360.0" x2="706.0" y2="360.0" stroke="#2c5d8f" stroke-dasharray="8 4"/><text x="708.4" y="364.0" text-anchor="start" font-size="10" fill="#2c5d8f">spindle line</text><text x="400.0" y="580.0" text-anchor="middle" font-size="11" fill="#222" font-weight="bold">BASE: one T-shaped casting ≈72 kg (2-person lift)</text><text x="694.0" y="228.0" text-anchor="start" font-size="11" fill="#222" font-weight="bold">PORTAL ≈41 kg (34 kg cored)</text><text x="643.6" y="425.5" text-anchor="start" font-size="10" fill="#9a7514">ferris-wheel ATC, turns in Y-Z</text><text x="400.0" y="598.0" text-anchor="middle" font-size="10" fill="#222">FRONT (Y motor)</text><text x="500.0" y="660.0" text-anchor="middle" font-size="11" fill="#555">Top view. Frame ≈106 kg EG in 2 castings (portal cored) (base + portal). Only joint: portal legs to base (dowels + bolts).</text><text x="500.0" y="676.0" text-anchor="middle" font-size="11" fill="#555">X travel 570 (400 work + reach to wheel), X rails 750, Y 250, Z 150. Legs span the table only (opening 500).</text></svg>