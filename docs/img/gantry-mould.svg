<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 620" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <pattern id="eg" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#c9c9c4"/>
      <circle cx="2" cy="2" r="1.1" fill="#8d8d87"/><circle cx="6" cy="5.5" r="0.9" fill="#9e9e98"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect width="1040" height="620" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#111">Gantry mould, cast lying on its front face (X-rail face down)</text>
  <text x="500" y="54" text-anchor="middle" fill="#555">Draft: 640 W × 460 H, beam 200 × 160 deep, uprights 120 × 160, solid, about 70 kg. Left: looking down into the mould. Right: section A–A</text>

  <g transform="translate(40,0)"><!-- portal outline (scale 0.8) -->
  <path d="M180,100 H692 V468 H596 V260 H276 V468 H180 Z" fill="url(#eg)" stroke="#555"/>
  <!-- mould wall around (simplified) -->
  <path d="M276,475 H173 V93 H699 V475 H596" fill="none" stroke="#d9b98a" stroke-width="14"/>
  <!-- split plug -->
  <path d="M276,260 H596 V482 H276 Z" fill="#e8d3b2" stroke="#5a3a14"/>
  <path d="M420,260 L452,482 M452,260 L420,482" stroke="#5a3a14" stroke-dasharray="4 3"/>
  <path d="M420,260 L452,260 L436,482 Z" fill="#c99b62" stroke="#5a3a14"/>
  <!-- rail insert bars (on floor, front face) -->
  <rect x="196" y="116" width="480" height="8" fill="#3d4f66"/>
  <rect x="196" y="236" width="480" height="8" fill="#3d4f66"/>
  <!-- joint bolt sleeves -->
  <g stroke="#1d2836" stroke-width="2" stroke-dasharray="6 3">
    <line x1="204" y1="100" x2="204" y2="468"/><line x1="252" y1="100" x2="252" y2="468"/>
    <line x1="620" y1="100" x2="620" y2="468"/><line x1="668" y1="100" x2="668" y2="468"/>
  </g>
  <!-- foot insert plates -->
  <rect x="180" y="462" width="96" height="6" fill="#3d4f66"/><rect x="596" y="462" width="96" height="6" fill="#3d4f66"/>

  </g>
  <g fill="#222">
    <text x="30" y="122">X rail insert bars</text>
    <text x="30" y="137">(on the floor = front face)</text>
    <line x1="150" y1="122" x2="236" y2="120" stroke="#333" marker-end="url(#ar)"/>
    <text x="30" y="330">M12 bolt sleeves</text>
    <text x="30" y="345">(waxed tube) through</text>
    <text x="30" y="360">each upright to the base</text>
    <line x1="150" y1="335" x2="242" y2="335" stroke="#333" marker-end="url(#ar)"/>
    <text x="30" y="500">Feet cast against the</text>
    <text x="30" y="515">mould end wall (flat)</text>
    <line x1="150" y1="500" x2="240" y2="470" stroke="#333" marker-end="url(#ar)"/>
    <text x="340" y="520">Three-piece wedge plug for the opening (table + rack pass through here).</text>
    <text x="340" y="536">Pull the centre wedge first, then the halves come out without fighting shrinkage.</text>
    <line x1="476" y1="508" x2="476" y2="470" stroke="#333" marker-end="url(#ar)"/>
    <text x="340" y="566">All sections solid.</text>
  </g>

  <!-- Section A-A -->
  <g transform="translate(40,0)">
  <text x="840" y="270" text-anchor="middle" font-weight="bold" fill="#111">A–A (through the beam)</text>
  <rect x="760" y="300" width="160" height="128" fill="url(#eg)" stroke="#555"/>
  
  <rect x="768" y="414" width="24" height="8" fill="#3d4f66"/><rect x="888" y="414" width="24" height="8" fill="#3d4f66"/>
  <rect x="771" y="422" width="18" height="6" fill="#d9b98a" stroke="#5a3a14" stroke-width="0.6"/><rect x="891" y="422" width="18" height="6" fill="#d9b98a" stroke="#5a3a14" stroke-width="0.6"/>
  <rect x="740" y="428" width="200" height="14" fill="#d9b98a" stroke="#5a3a14"/>
      <g fill="#222" font-size="12">
    <text x="840" y="462" text-anchor="middle">Floor = front face (X rails)</text>
    <text x="840" y="478" text-anchor="middle">Open side = back of beam</text>
    <text x="840" y="494" text-anchor="middle">Rails 150 mm apart</text>
  </g>
  </g>
</svg>
